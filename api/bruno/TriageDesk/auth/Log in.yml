info:
  name: Log in
  type: http
  seq: 2

http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
      "email":"xyz1@test.com",
      "password":"secret111"}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
