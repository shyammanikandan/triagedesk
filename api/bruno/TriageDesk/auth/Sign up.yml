info:
  name: Sign up
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/auth/signup'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {"name":"xyz",
      "email":"xyz@test.com",
      "password":"secret111"}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
