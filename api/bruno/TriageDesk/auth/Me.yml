info:
  name: Me
  type: http
  seq: 3

http:
  method: GET
  url: '{{baseUrl}}/auth/me'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ''
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.role
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
